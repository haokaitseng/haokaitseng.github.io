<svg width="680" height="460" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>IT core with three business units and their vendors</title>
<desc>A central IT circle surrounded by three half-moon business unit segments, each connected outward to its own vendor; business unit A connects to two vendors.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<path d="M213.6 143.9 A165 165 0 0 1 466.4 143.9 L412.8 188.9 A95 95 0 0 0 267.2 188.9 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="340" y="112" text-anchor="middle" fill="#085041" font-size="15" font-weight="bold">Business unit A</text>
<text x="340" y="130" text-anchor="middle" fill="#0F6E56" font-size="11">Specialized tools</text>

<path d="M495.1 193.6 A165 165 0 0 1 368.6 412.5 L356.5 343.6 A95 95 0 0 0 429.3 217.5 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="452" y="308" text-anchor="middle" fill="#085041" font-size="15" font-weight="bold">Business unit B</text>
<text x="452" y="326" text-anchor="middle" fill="#0F6E56" font-size="11">Specialized tools</text>

<path d="M311.3 412.5 A165 165 0 0 1 184.9 193.6 L250.7 217.5 A95 95 0 0 0 323.5 343.6 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="228" y="308" text-anchor="middle" fill="#085041" font-size="15" font-weight="bold">Business unit C</text>
<text x="228" y="326" text-anchor="middle" fill="#0F6E56" font-size="11">Specialized tools</text>

<circle cx="340" cy="250" r="72" fill="#EFEFEA" stroke="#6B6B66" stroke-width="1"/>
<text x="340" y="246" text-anchor="middle" fill="#33332F" font-size="15" font-weight="bold">IT department</text>
<text x="340" y="266" text-anchor="middle" fill="#5C5C57" font-size="11">Paved road, standards</text>

<line x1="300" y1="90" x2="235" y2="54" stroke="#8A8A85" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="115" y="14" width="120" height="36" rx="8" fill="#FBEAE4" stroke="#B5502F" stroke-width="1"/>
<text x="175" y="36" text-anchor="middle" fill="#7A3018" font-size="14" font-weight="bold">Vendor A1</text>

<line x1="380" y1="90" x2="445" y2="54" stroke="#8A8A85" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="445" y="14" width="120" height="36" rx="8" fill="#FBEAE4" stroke="#B5502F" stroke-width="1"/>
<text x="505" y="36" text-anchor="middle" fill="#7A3018" font-size="14" font-weight="bold">Vendor A2</text>

<line x1="484" y1="334" x2="516" y2="338" stroke="#8A8A85" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="520" y="320" width="120" height="36" rx="8" fill="#FBEAE4" stroke="#B5502F" stroke-width="1"/>
<text x="580" y="342" text-anchor="middle" fill="#7A3018" font-size="14" font-weight="bold">Vendor B</text>

<line x1="196" y1="334" x2="164" y2="338" stroke="#8A8A85" stroke-width="1.5" marker-end="url(#arrow)"/>
